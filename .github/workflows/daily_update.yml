name: Daily universe rotation update

# Runs one bounded batch of the all-NSE universe each weekday evening (IST)
# and commits per-stock JSON snapshots back to this repo. The hosted app
# reads these snapshots, so the site shows refreshed data with honest
# per-stock dates. This is a rotation (full universe over about 2.5 weeks at 150 stocks
# per weekday), not a same-day full-market scan.

on:
  schedule:
    # 18:30 IST = 13:00 UTC, Monday-Friday
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh BSE universe from latest bhavcopy
        # public BSE download; refreshes the committed BSE universe to the
        # latest session. Never fails the run: the committed CSV stays in use.
        run: python scripts/update_bse_universe.py

      - name: Run one rotation batch
        env:
          # measured in CI ~3.4 s/stock: 150 finishes in ~5-9 min, well inside the 16-min budget
          MB_BATCH_SIZE: "150"
          MB_MAX_MINUTES: "16"
        run: python scripts/daily_update.py

      - name: Run automation alert checks
        # market-data-only alerts from committed snapshots; no user state
        run: python scripts/automation_alerts.py

      - name: Run automated research ranking
        # ranked candidate feed from committed snapshots; no user state
        run: python scripts/automation_rank.py

      - name: Generate narrative reports for top candidates
        # bounded re-research of top-K with report exports; no user state
        run: python scripts/automation_reports.py

      - name: Rebuild cap-sections feed
        # cap-group sections + Top 50 from snapshots, AMFI cap map and latest
        # bhavcopy close; never fails the run (last good feed stays committed)
        continue-on-error: true
        run: cd scripts && python build_cap_sections.py

      - name: Rebuild ETF-sections feed
        # curated ETF NAV (AMFI) + close (BSE bhavcopy); never fails the run
        continue-on-error: true
        run: cd scripts && python build_etf_sections.py

      - name: Commit snapshots
        run: |
          git config user.name "multibagger-scout-bot"
          git config user.email "logeshgameing638@gmail.com"
          git add data/snapshots data/rotation_state.json data/automation data/universe_bse.csv
          git diff --cached --quiet || git commit -m "Daily rotation update $(date -u +%F)"
          # web-editor commits can land while a run is in flight; rebase then retry once
          git pull --rebase origin main || (git rebase --abort; git pull --rebase origin main)
          git push || (git pull --rebase origin main && git push)
