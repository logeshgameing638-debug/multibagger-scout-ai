name: Daily universe rotation update

# Runs one bounded batch of the all-NSE universe each weekday evening (IST)
# and commits per-stock JSON snapshots back to this repo. The hosted app
# reads these snapshots, so the site shows refreshed data with honest
# per-stock dates. This is a rotation (full universe over about 2.5 weeks at 150 stocks
# per weekday), not a same-day full-market scan.

on:
  schedule:
    # 18:30 IST = 13:00 UTC, Monday-Friday
    - cron: "0 13 * * 1-5"
    # backup slot 20:00 IST = 14:30 UTC: catches an evening the 18:30
    # schedule was lost/delayed by the Actions scheduler. The dedupe guard
    # below ensures only one batch actually runs per day.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Rotation batch size for this manual run (default 150; small values prove the pipeline with minimal provider load)"
        required: false
        default: "150"


permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a batch already ran today
        # Freshness definition: one processed rotation batch per IST day,
        # evidenced by data/rotation_state.json last_run_at - an outcome
        # signal, not a green run (a run can succeed without committing; a
        # skipped backup exits green without processing; bot pushes can be
        # orphaned by history rewrites, so commit presence is unreliable).
        # Scheduled slots only; a manual dispatch always runs. The
        # concurrency group serializes the two slots. Fail-open: if the
        # state file cannot be read, the batch runs (bounded: 150 stocks,
        # 16-minute budget, aborts on sustained provider 429s). The
        # stopped_reason/system_error/skipped_time_budget fields are written
        # by scripts/daily_update.py run_batch and are the actual provider-
        # halt representation.
        id: dupcheck
        if: github.event_name == 'schedule'
        run: |
          today_ist=$(TZ=Asia/Kolkata date +%F)
          state=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/data/rotation_state.json")
          last=$(echo "$state" | jq -r '.last_run_at // ""')
          stopped=$(echo "$state" | jq -r '.last_run_stopped_reason // ""')
          syserr=$(echo "$state" | jq -r '.last_run.system_error // 1')
          skipped=$(echo "$state" | jq -r '.last_run.skipped_time_budget // 1')
          echo "last_run_at=$last today_ist=$today_ist stopped='$stopped' system_error=$syserr skipped_budget=$skipped"
          # healthy completion only: a provider-halt (last_run_stopped_reason),
          # any system_error, or a time-budget cut means the backup still runs
          if [ -n "$last" ] && [ "${last:0:10}" = "$today_ist" ] && [ -z "$stopped" ] && [ "$syserr" = "0" ] && [ "$skipped" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.dupcheck.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.dupcheck.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Refresh BSE universe from latest bhavcopy
        if: steps.dupcheck.outputs.skip != 'true'
        # public BSE download; refreshes the committed BSE universe to the
        # latest session. Never fails the run: the committed CSV stays in use.
        run: python scripts/update_bse_universe.py

      - name: Run one rotation batch
        if: steps.dupcheck.outputs.skip != 'true'
        env:
          # measured in CI ~3.4 s/stock: 150 finishes in ~5-9 min, well inside the 16-min budget
          MB_BATCH_SIZE: ${{ github.event.inputs.batch_size || '150' }}
          MB_MAX_MINUTES: "16"
        run: python scripts/daily_update.py

      - name: Run automation alert checks
        if: steps.dupcheck.outputs.skip != 'true'
        # market-data-only alerts from committed snapshots; no user state
        run: python scripts/automation_alerts.py

      - name: Run automated research ranking
        if: steps.dupcheck.outputs.skip != 'true'
        # ranked candidate feed from committed snapshots; no user state
        run: python scripts/automation_rank.py

      - name: Generate narrative reports for top candidates
        if: steps.dupcheck.outputs.skip != 'true'
        # bounded re-research of top-K with report exports; no user state
        run: python scripts/automation_reports.py

      - name: Rebuild cap-sections feed
        if: steps.dupcheck.outputs.skip != 'true'
        # cap-group sections + Top 50 from snapshots, AMFI cap map and latest
        # bhavcopy close; never fails the run (last good feed stays committed)
        continue-on-error: true
        run: cd scripts && python build_cap_sections.py

      - name: Rebuild ETF-sections feed
        if: steps.dupcheck.outputs.skip != 'true'
        # curated ETF NAV (AMFI) + close (BSE bhavcopy); never fails the run
        continue-on-error: true
        run: cd scripts && python build_etf_sections.py

      - name: Rebuild ETF NAV technicals feed
        if: steps.dupcheck.outputs.skip != 'true'
        # NAV-history indicators for curated ETFs via free AMFI mirror;
        # NAV basis only, no trade setups; never fails the run
        continue-on-error: true
        run: cd scripts && python build_etf_technicals.py

      - name: Refresh company profiles (bounded batch)
        if: steps.dupcheck.outputs.skip != 'true'
        # Written descriptions + per-period results from screener.in public
        # pages, stale-priority rotation, default 25 symbols per run.
        # Never fails the run: the committed feed stays in use.
        continue-on-error: true
        run: python scripts/build_company_profiles.py

      - name: Commit snapshots
        if: steps.dupcheck.outputs.skip != 'true'
        run: |
          git config user.name "multibagger-scout-bot"
          git config user.email "logeshgameing638@gmail.com"
          git add data/snapshots data/rotation_state.json data/automation data/universe_bse.csv data/etf_technicals.json data/etf_universe.json
          git diff --cached --quiet || git commit -m "Daily rotation update $(date -u +%F)"
          # web-editor commits can land while a run is in flight; rebase then retry once
          git pull --rebase origin main || (git rebase --abort; git pull --rebase origin main)
          git push || (git pull --rebase origin main && git push)
